name: payflow-ai-prod

services:

  # ==========================================
  # POSTGRESQL - PRESERVED FOR LOCAL/BACKUP USE
  # ==========================================
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: payflow
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - payflow-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d payflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # REDIS
  # ==========================================
  redis:
    image: redis:7
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command:
      - sh
      - -c
      - 'exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"'
    volumes:
      - payflow-redis-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - 'REDISCLI_AUTH="$${REDIS_PASSWORD}" redis-cli ping | grep -q PONG'
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # KAFKA
  # ==========================================
  kafka:
    image: apache/kafka:4.3.1
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - payflow-kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        - CMD
        - /opt/kafka/bin/kafka-broker-api-versions.sh
        - --bootstrap-server
        - localhost:9092
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ==========================================
  # OLLAMA
  # ==========================================
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - payflow-ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ==========================================
  # OLLAMA MODEL INITIALIZATION
  # ==========================================
  ollama-init:
    image: ollama/ollama:latest
    restart: "no"
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "ollama pull \"$${OLLAMA_MODEL}\""
    depends_on:
      ollama:
        condition: service_healthy

  # ==========================================
  # FRAUD DETECTION SERVICE
  # ==========================================
  fraud:
    image: ghcr.io/varshithahify/payflow-fraud:0730f69aa1b32e05168478c5afb9e32a568794a0
    restart: unless-stopped
    environment:
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json,urllib.request; d=json.load(urllib.request.urlopen('http://127.0.0.1:8083/health',timeout=3)); assert d.get('status')=='UP' and d.get('model')=='loaded'"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ==========================================
  # SPRING BOOT BACKEND
  # ==========================================
  backend:
    image: ghcr.io/varshithahify/payflow-backend:0730f69aa1b32e05168478c5afb9e32a568794a0
    restart: unless-stopped
    environment:
      SERVER_PORT: 8081

      # Production profile
      SPRING_PROFILES_ACTIVE: prod

      # Neon PostgreSQL
      SPRING_DATASOURCE_URL: "jdbc:postgresql://${NEON_DB_HOST}:5432/${NEON_DB_NAME}?sslmode=require"
      SPRING_DATASOURCE_USERNAME: ${NEON_DB_USERNAME:?NEON_DB_USERNAME is required}
      SPRING_DATASOURCE_PASSWORD: ${NEON_DB_PASSWORD:?NEON_DB_PASSWORD is required}

      # Redis
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      SPRING_DATA_REDIS_URL: ${REDIS_URL:?REDIS_URL is required}

      # Kafka
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

      # Fraud detection
      FRAUD_SERVICE_URL: http://fraud:8083

      # Ollama
      SPRING_AI_OLLAMA_BASE_URL: http://ollama:11434
      SPRING_AI_OLLAMA_CHAT_OPTIONS_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}

      # JWT
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-3600000}

      # CORS
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}

    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      fraud:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ==========================================
  # REACT FRONTEND + NGINX
  # ==========================================
  frontend:
    image: ghcr.io/varshithahify/payflow-frontend:0730f69aa1b32e05168478c5afb9e32a568794a0
    restart: unless-stopped
    ports:
      - "80:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - "wget -q --spider http://127.0.0.1:8080/health || exit 1"
      interval: 30s
      timeout: 5s
      retries: 3

# ==========================================
# PERSISTENT VOLUMES
# ==========================================
volumes:
  payflow-postgres-data:
  payflow-redis-data:
  payflow-kafka-data:
  payflow-ollama-data: