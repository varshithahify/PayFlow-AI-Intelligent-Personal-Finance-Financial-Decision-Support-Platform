# ==========================================
# PAYFLOW AI - PRODUCTION CONFIGURATION
# ==========================================

# Database
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# HikariCP connection pool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.baseline-version=1

# Redis
spring.data.redis.url=${REDIS_URL}
spring.data.redis.timeout=5000ms

# Kafka
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka:9092}

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Logging
logging.level.root=INFO
logging.level.org.springframework.security=INFO
logging.level.com.payflow.payflow_backend.security=INFO
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=WARN