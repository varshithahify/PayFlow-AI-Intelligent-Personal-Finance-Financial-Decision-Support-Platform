name: PayFlow AI CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: payflow-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ==========================================
  # BACKEND CI
  # ==========================================

  backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/payflow-backend/pom.xml

      - name: Start infrastructure
        run: docker compose up -d postgres redis kafka

      - name: Wait for Kafka
        run: |
          for i in {1..60}; do
            if timeout 10s docker exec payflow-kafka /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1; then
              echo "Kafka is ready"
              exit 0
            fi
            echo "Waiting for Kafka: $i/60"
            sleep 3
          done

          docker logs payflow-kafka || true
          exit 1

      - name: Verify infrastructure
        run: |
          docker compose ps

          for i in {1..30}; do
            if docker exec payflow-postgres pg_isready -U postgres -d payflow >/dev/null 2>&1; then
              echo "PostgreSQL is ready"
              break
            fi
            sleep 2
          done

          docker exec payflow-postgres pg_isready -U postgres -d payflow

          for i in {1..30}; do
            if [ "$(docker exec payflow-redis redis-cli ping)" = "PONG" ]; then
              echo "Redis is ready"
              exit 0
            fi
            sleep 2
          done

          echo "Redis failed to start"
          exit 1

      - name: Run backend tests
        working-directory: backend/payflow-backend
        env:
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          JWT_SECRET: ci-only-secret-key-must-be-long-enough-for-testing-2026
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5433/payflow
          SPRING_KAFKA_BOOTSTRAP_SERVERS: localhost:9094
          SPRING_DATA_REDIS_HOST: localhost
          SPRING_DATA_REDIS_PORT: 6380
        run: |
          chmod +x ./mvnw
          ./mvnw -B clean verify

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/payflow-backend/target/site/jacoco/
          if-no-files-found: ignore

      - name: Stop infrastructure
        if: always()
        run: docker compose down


  # ==========================================
  # FRONTEND CI
  # ==========================================

  frontend:
    name: Frontend Tests and Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm run test:run

      - name: Build production frontend
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore


  # ==========================================
  # PYTHON FRAUD SERVICE CI
  # ==========================================

  fraud-service:
    name: Fraud Service Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: payflow-fraud

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: payflow-fraud/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run fraud service tests
        run: python -m pytest tests -v --junitxml=pytest-results.xml

      - name: Upload Python test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fraud-service-test-results
          path: payflow-fraud/pytest-results.xml
          if-no-files-found: ignore


  # ==========================================
  # DOCKER BUILD, SCAN AND PUBLISH
  # ==========================================

  docker:
    name: Docker Build and Security Scan
    runs-on: ubuntu-latest

    needs:
      - backend
      - frontend
      - fraud-service

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare image names
        id: images
        shell: bash
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "prefix=ghcr.io/$OWNER" >> "$GITHUB_OUTPUT"

      - name: Build backend image
        run: |
          docker build \
            -t ${{ steps.images.outputs.prefix }}/payflow-backend:${{ github.sha }} \
            ./backend/payflow-backend

      - name: Build frontend image
        run: |
          docker build \
            -t ${{ steps.images.outputs.prefix }}/payflow-frontend:${{ github.sha }} \
            ./frontend

      - name: Build fraud service image
        run: |
          docker build \
            -f payflow-fraud/Dockerfile.cpu-candidate \
            -t ${{ steps.images.outputs.prefix }}/payflow-fraud:${{ github.sha }} \
            ./payflow-fraud

      - name: Scan backend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.images.outputs.prefix }}/payflow-backend:${{ github.sha }}
          format: table
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.images.outputs.prefix }}/payflow-frontend:${{ github.sha }}
          format: table
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan fraud service image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.images.outputs.prefix }}/payflow-fraud:${{ github.sha }}
          format: table
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Docker images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          IMAGE_PREFIX: ${{ steps.images.outputs.prefix }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          for service in payflow-backend payflow-frontend payflow-fraud; do
            docker tag "$IMAGE_PREFIX/$service:$IMAGE_TAG" "$IMAGE_PREFIX/$service:latest"
            docker push "$IMAGE_PREFIX/$service:$IMAGE_TAG"
            docker push "$IMAGE_PREFIX/$service:latest"
          done
