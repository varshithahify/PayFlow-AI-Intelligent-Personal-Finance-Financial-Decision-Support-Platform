# PostgreSQL Database
spring.datasource.url=jdbc:postgresql://localhost:5432/payflow
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# Server
server.port=8081

# JWT
jwt.secret=${JWT_SECRET:payflow-local-development-secret-key-2026-very-long}
jwt.expiration=${JWT_EXPIRATION:3600000}

# Logging
logging.level.org.springframework.security=DEBUG
logging.level.com.payflow.payflow_backend.security=DEBUG

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.baseline-version=1

# Kafka
spring.kafka.bootstrap-servers=localhost:9094

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6380

# Fraud Detection Service
fraud.service.url=${FRAUD_SERVICE_URL:http://localhost:8083}

# Spring AI - Ollama Local Model
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=llama3.2:3b

logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=TRACE


