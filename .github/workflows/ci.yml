name: PayFlow AI CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/payflow-backend/pom.xml

      - name: Start infrastructure services
        run: docker compose up -d postgres redis kafka

      - name: Wait for Kafka
        run: |
          for i in {1..60}; do
            if docker exec payflow-kafka /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1; then
              echo "Kafka broker is ready"
              exit 0
            fi
            sleep 2
          done

          echo "Kafka broker failed to start"
          docker logs payflow-kafka
          exit 1

      - name: Verify infrastructure
        run: |
          docker compose ps

          for i in {1..30}; do
            if docker exec payflow-postgres pg_isready -U postgres -d payflow >/dev/null 2>&1; then
              echo "PostgreSQL is ready"
              break
            fi
            sleep 2
          done

          docker exec payflow-postgres pg_isready -U postgres -d payflow

          for i in {1..30}; do
            if [ "$(docker exec payflow-redis redis-cli ping)" = "PONG" ]; then
              echo "Redis is ready"
              exit 0
            fi
            sleep 2
          done

          echo "Redis failed to start"
          exit 1

      - name: Run backend tests and coverage
        working-directory: backend/payflow-backend
        env:
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          JWT_SECRET: ci-only-secret-key-must-be-long-enough-for-testing-2026
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5433/payflow
          SPRING_KAFKA_BOOTSTRAP_SERVERS: localhost:9094
          SPRING_DATA_REDIS_HOST: localhost
          SPRING_DATA_REDIS_PORT: 6380
        run: |
          chmod +x ./mvnw
          ./mvnw -B clean verify

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/payflow-backend/target/site/jacoco/
          if-no-files-found: ignore

      - name: Stop infrastructure services
        if: always()
        run: docker compose down

  frontend:
    name: Frontend Tests and Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend unit tests
        run: npm run test:run

      - name: Build production frontend
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
